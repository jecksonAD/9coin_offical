name: ninecoin
description: A new Flutter project.
publish_to: "none"

version: 1.0.22+22

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  badges: ^3.2.0
  flutter_inappwebview: ^6.1.5
  barcode_widget: ^2.0.1
  cached_network_image: ^3.2.3
  cupertino_icons: ^1.0.2
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.7.0
  flutter_localizations:
    sdk: flutter
  flutter_pdfview: ^1.2.5
  flutter_spinkit: ^5.1.0
  http: ^1.6.0
  image_picker: ^1.2.1
  firebase_messaging: ^16.2.0
  path: ^1.8.0
  path_provider: ^2.0.11
  qr_flutter: ^4.0.0
  shared_preferences: ^2.0.15
  toast: ^0.3.0
  url_launcher: ^6.1.6
  webview_flutter: ^4.13.1
  carousel_slider: ^5.1.2
  pull_to_refresh: ^2.0.0
  modal_progress_hud_nsn: ^0.5.1
  font_awesome_flutter: ^11.0.0
  auto_size_text: ^3.0.0
  barcode: ^2.1.0
  syncfusion_flutter_barcodes: ^33.2.3
  network_handler: ^1.0.1
  json_annotation: ^4.7.0
  full_screen_image: ^2.0.0
  http_parser: ^4.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/9-com-3.png"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logos/
    - assets/pics/
    - assets/prize_gif/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

    - family: Poppins Regular
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

    - family: Poppins SemiBold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

    - family: Vollkorn SemiBold
      fonts:
        - asset: assets/fonts/Vollkorn-SemiBold.ttf
          weight: 600
